# webconference.bunsenbrenner.org: the real ct-agent-wasm video-conferencing demo
# (channel-join + Noise_IK handshake + encrypted WebRTC signaling, driving a real
# RTCPeerConnection), reachable over a real Let's Encrypt certificate obtained at
# the origin via deSEC DNS-01 (issued CORE-side, relayed in -- see README).
#
# Runs ALONGSIDE an already-running CADS-Tunnel plane (ct-edge with
# CT_EDGE_BROWSER_LISTEN=:443 for this compose's own Browser-Plane tunnel, AND
# CT_EDGE_WS_CHANNEL_LISTEN published for the video-call WebSocket traffic itself --
# see CADS-Tunnel's docker/deploy/compose.selfhost.yml). Adapt
# WEBCONFERENCE_AGENT_EDGE/WEBCONFERENCE_AGENT_CP_URL/WEBCONFERENCE_EDGE_WS to your
# plane.
#
# When co-located on the same host as a CADS-Tunnel self-host deployment (compose
# project name "ct-selfhost", i.e. docker/deploy/compose.selfhost.yml run from a
# directory literally named `deploy` -- Compose derives the network name from the
# project name), this joins that deployment's own `default` network directly
# (PLANE_NETWORK, external) so `edge`/`control-plane` resolve as plain service
# hostnames -- no IP-address guessing. Override PLANE_NETWORK if your plane's
# compose project has a different name, or fall back to IP-based
# WEBCONFERENCE_AGENT_EDGE/WEBCONFERENCE_AGENT_CP_URL/WEBCONFERENCE_EDGE_WS values
# (and drop the `networks:` blocks below) for a genuinely remote/non-co-located plane.
#
#   ./build-wasm.sh   # build pkg/ first -- Caddy.Dockerfile COPYs it in
#   docker compose -f compose.webconference-demo.yml --env-file .env up --build -d
services:
  webconference-demo-origin:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    environment:
      # Caddy's {$WEBCONFERENCE_EDGE_WS} substitution in Caddyfile reads this.
      - WEBCONFERENCE_EDGE_WS=${WEBCONFERENCE_EDGE_WS:?set WEBCONFERENCE_EDGE_WS=<plane host>:<CT_EDGE_WS_CHANNEL_LISTEN port, e.g. 4437>}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEBCONFERENCE_CERT_DIR:?set WEBCONFERENCE_CERT_DIR=<dir with fullchain.pem+privkey.pem from the operator>}:/certs:ro
      - webconference_demo_caddy_data:/data
    expose:
      - "443"   # reachable only via the tunnel/agent, not published to the host
    networks:
      - default
      - plane
    restart: unless-stopped

  webconference-demo-agent:
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        - CT_AGENT_REF=${CT_AGENT_REF:-b03f2efd1ab5ec34d745a98336593fa6d9791ff1}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_HOSTNAME=webconference.bunsenbrenner.org
      - CT_AGENT_TOKEN=${WEBCONFERENCE_AGENT_TOKEN:-}
      - CT_AGENT_ORIGIN=webconference-demo-origin:443
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${WEBCONFERENCE_AGENT_EDGE:?edge host:port, e.g. edge:4433}
      - CT_AGENT_CP_URL=${WEBCONFERENCE_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${WEBCONFERENCE_JOIN_TOKEN:?single-use join token}
      - CT_AGENT_ID=webconference-demo
      - CT_AGENT_EDGE_CERT_URL=${WEBCONFERENCE_AGENT_EDGE_CERT_URL:-}
      # Restart-safe onboarding: persist the bound identity so a container restart
      # restores it instead of re-redeeming the single-use join token (same fix
      # help-site/CADS-auction-demo needed for #141).
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    volumes:
      - webconference_demo_agent_state:/var/lib/ct-agent
    depends_on:
      - webconference-demo-origin
    networks:
      - default
      - plane
    command: ["ct-agent", "onboard"]
    restart: unless-stopped

networks:
  default: {}
  plane:
    external: true
    name: ${PLANE_NETWORK:-ct-selfhost_default}

volumes:
  webconference_demo_caddy_data:
  webconference_demo_agent_state:
