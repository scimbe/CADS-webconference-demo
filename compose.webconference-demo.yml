# webconference.bunsenbrenner.org: the real ct-agent-wasm video-conferencing demo
# (channel-join + Noise_IK handshake + encrypted WebRTC signaling, driving a real
# RTCPeerConnection), reachable over a real Let's Encrypt certificate obtained at
# the origin via deSEC DNS-01 (issued CORE-side, relayed in -- see README).
#
# Runs ALONGSIDE an already-running CADS-Tunnel plane (ct-edge with
# CT_EDGE_BROWSER_LISTEN=:443 for this compose's own Browser-Plane tunnel, AND
# CT_EDGE_WS_CHANNEL_LISTEN published for the video-call WebSocket traffic itself --
# see CADS-Tunnel's docker/deploy/compose.selfhost.yml). Adapt
# WEBCONFERENCE_AGENT_EDGE/WEBCONFERENCE_AGENT_CP_URL/WEBCONFERENCE_EDGE_WS to your
# plane.
#
# When co-located on the same host as a CADS-Tunnel self-host deployment (compose
# project name "ct-selfhost", i.e. docker/deploy/compose.selfhost.yml run from a
# directory literally named `deploy` -- Compose derives the network name from the
# project name), this joins that deployment's own `default` network directly
# (PLANE_NETWORK, external) so `edge`/`control-plane` resolve as plain service
# hostnames -- no IP-address guessing. Override PLANE_NETWORK if your plane's
# compose project has a different name, or fall back to IP-based
# WEBCONFERENCE_AGENT_EDGE/WEBCONFERENCE_AGENT_CP_URL/WEBCONFERENCE_EDGE_WS values
# (and drop the `networks:` blocks below) for a genuinely remote/non-co-located plane.
#
#   ./build-wasm.sh   # build pkg/ first -- Caddy.Dockerfile COPYs it in
#   docker compose -f compose.webconference-demo.yml --env-file .env up --build -d
services:
  webconference-demo-origin:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    environment:
      # Caddy's {$WEBCONFERENCE_EDGE_WS} substitution in Caddyfile reads this.
      - WEBCONFERENCE_EDGE_WS=${WEBCONFERENCE_EDGE_WS:?set WEBCONFERENCE_EDGE_WS=<plane host>:<CT_EDGE_WS_CHANNEL_LISTEN port, e.g. 4437>}
      # Browser-Plane login gate (optional, CADS-Tunnel #382-follow): the control
      # plane's own public host -- e.g. bunsenbrenner.org. Only matters once the
      # tunnel owner actually enables the login gate from the portal; harmless
      # (unused) otherwise. Defaults to the operator's own zone so this repo's
      # default demo works with zero extra config.
      - CT_GATE_UPSTREAM_HOST=${CT_GATE_UPSTREAM_HOST:-bunsenbrenner.org}
      # CADS-webconference-demo#68: the base Caddyfile's /api/* proxy target
      # -- see webconference-demo-bridge below, added alongside this fix.
      - WEBCONFERENCE_BRIDGE_ADDR=webconference-demo-bridge:8791
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEBCONFERENCE_CERT_DIR:?set WEBCONFERENCE_CERT_DIR=<dir with fullchain.pem+privkey.pem from the operator>}:/certs:ro
      - webconference_demo_caddy_data:/data
    expose:
      - "443"   # reachable only via the tunnel/agent, not published to the host
    depends_on:
      - webconference-demo-bridge
    networks:
      - default
      - plane
    restart: unless-stopped

  webconference-demo-bridge:
    # CADS-webconference-demo#68: this service (and the origin's
    # WEBCONFERENCE_BRIDGE_ADDR + Caddyfile's `/api/*` proxy above/below) was
    # missing from this base compose entirely -- README's "Self-hosting" path
    # ran this file and got a frontend where every /api/* 404s (identity
    # renders client-side via WASM, so the page LOADS, but dialing/presence/
    # contacts/messenger are all dead). The live site never hit this because
    # it runs compose.webconference-demo.selfservice.yml, which already has
    # this service -- mirrored from there verbatim (same env, same purpose:
    # directory + presence + call-signaling, see bridge/server.js's own
    # header comment), just sourced from this file's own
    # WEBCONFERENCE_AGENT_CP_URL (already required below for the agent,
    # rather than introducing a second control-plane-URL var for the same
    # value) and CT_AGENT_HOSTNAME hardcoded to match the agent's own
    # hardcoded value below, the same way this file already keeps them in
    # sync (not sourced from one shared var, unlike the selfservice compose,
    # since neither service here parameterizes the hostname at all).
    build:
      context: ./bridge
      additional_contexts:
        grant-bin: ./video-call-grant/target/release
    environment:
      - WEBCONFERENCE_BRIDGE_LISTEN=0.0.0.0:8791
      - WEBCONFERENCE_ACCESS_REQUESTS_FILE=/srv/data/access-requests.json
      - CT_AGENT_CP_URL=${WEBCONFERENCE_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_HOSTNAME=webconference.bunsenbrenner.org
      - WEBCONFERENCE_TUNNEL_ID=${WEBCONFERENCE_TUNNEL_ID:-}
      - WEBCONFERENCE_ADMIN_EMAILS=${WEBCONFERENCE_ADMIN_EMAILS:-}
      # See compose.webconference-demo.selfservice.yml's matching block for
      # the full CT_CHANNEL_OPERATOR_KEY/CT_OIDC_CLIENT_SECRET/
      # CT_PORTAL_SESSION_COOKIE Docker-secrets migration path
      # (CADS-webconference-demo#30) -- same tradeoff, not switched over here
      # either.
      - CT_CHANNEL_OPERATOR_KEY=${WEBCONFERENCE_OPERATOR_KEY:?this demo's channel operator private key, 64-hex, from ct-agent channel operator-init}
      - CT_OIDC_CLIENT_ID=${WEBCONFERENCE_OIDC_CLIENT_ID:-}
      - CT_OIDC_CLIENT_SECRET=${WEBCONFERENCE_OIDC_CLIENT_SECRET:-}
      - CT_OIDC_TOKEN=${WEBCONFERENCE_OIDC_TOKEN:-}
      - CT_PORTAL_SESSION_COOKIE=${WEBCONFERENCE_PORTAL_SESSION_COOKIE:-}
    volumes:
      - webconference_demo_access_requests:/srv/data
    expose:
      - "8791"
    networks:
      - default
      - plane
    restart: unless-stopped

  webconference-demo-agent:
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        # CADS-webconference-demo#29: aligned with build-wasm.sh/Agent.Dockerfile/
        # compose.webconference-demo.selfservice.yml's own defaults -- see
        # build-wasm.sh's comment. Bumped 2026-08-13 (v0.4.8, ADMISSION_EXCHANGE_TIMEOUT
        # 15s -> 45s -- the actual root cause of the CADS-flappy-demo admission-stall
        # saga); all four sync locations updated together.
        - CT_AGENT_REF=${CT_AGENT_REF:-a3d33f8b68aeafc3b53646a7ccd183c4ba807585}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_HOSTNAME=webconference.bunsenbrenner.org
      - CT_AGENT_TOKEN=${WEBCONFERENCE_AGENT_TOKEN:-}
      - CT_AGENT_ORIGIN=webconference-demo-origin:443
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${WEBCONFERENCE_AGENT_EDGE:?edge host:port, e.g. edge:4433}
      - CT_AGENT_CP_URL=${WEBCONFERENCE_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${WEBCONFERENCE_JOIN_TOKEN:?single-use join token}
      - CT_AGENT_ID=webconference-demo
      - CT_AGENT_EDGE_CERT_URL=${WEBCONFERENCE_AGENT_EDGE_CERT_URL:-}
      # Restart-safe onboarding: persist the bound identity so a container restart
      # restores it instead of re-redeeming the single-use join token (same fix
      # help-site/CADS-auction-demo needed for #141).
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    volumes:
      - webconference_demo_agent_state:/var/lib/ct-agent
    depends_on:
      - webconference-demo-origin
    networks:
      - default
      - plane
    command: ["ct-agent", "onboard"]
    restart: unless-stopped

networks:
  default: {}
  plane:
    external: true
    name: ${PLANE_NETWORK:-ct-selfhost_default}

volumes:
  webconference_demo_caddy_data:
  webconference_demo_agent_state:
  webconference_demo_access_requests:
