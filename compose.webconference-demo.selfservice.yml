# Self-service variant: deploys webconference-demo on the workflow-maintainer
# portal account's own free-tier tunnel (site-34a13a96.bunsenbrenner.org)
# instead of the operator-issued webconference.bunsenbrenner.org hostname the
# base compose.webconference-demo.yml targets. Differences from the base file:
#   - origin serves plain HTTP on :80 (Caddyfile.selfservice), no cert volume --
#     the tunnel is in Gelb, so the edge terminates TLS with a shared cert and
#     relays plaintext here (docs/agent-onboarding.md "Certificate status").
#     Once `ct-agent certificate` reaches Grün, switch back to the base
#     Caddyfile + a cert volume and reissue on :443.
#   - no external `plane` docker network: this account's tunnel connects out to
#     the public bunsenbrenner.org:4433 edge over the network, the same shape
#     already proven by flappy-demo/cookbook-demo's own compose files, not by
#     joining the local ct-selfhost_default network.
#
#   ./build-wasm.sh
#   docker compose -f compose.webconference-demo.selfservice.yml --env-file .env.selfservice up --build -d
services:
  webconference-demo-origin:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    environment:
      - WEBCONFERENCE_EDGE_WS=${WEBCONFERENCE_EDGE_WS:?set WEBCONFERENCE_EDGE_WS=<plane host>:<CT_EDGE_WS_CHANNEL_LISTEN port, e.g. 4437>}
      - WEBCONFERENCE_BRIDGE_ADDR=webconference-demo-bridge:8791
    volumes:
      - ./Caddyfile.selfservice:/etc/caddy/Caddyfile:ro
      - webconference_demo_caddy_data_ss:/data
    expose:
      - "80"
    depends_on:
      - webconference-demo-bridge
    restart: unless-stopped

  webconference-demo-bridge:
    # Directory + presence + call-signaling service (email-based dialing) --
    # see bridge/server.js's own header comment for the full design and the
    # one gated step (control-plane channel registration, CADS-Tunnel#214).
    build:
      context: ./bridge
      additional_contexts:
        grant-bin: ./video-call-grant/target/release
    environment:
      - WEBCONFERENCE_BRIDGE_LISTEN=0.0.0.0:8791
      # CADS-webconference-demo#41 (finding 3): pending access requests are
      # persisted here (atomic-write JSON, see server.js's own comment) so a
      # container recreate -- not just a same-container process restart --
      # doesn't silently drop them; needs the volume below since /srv itself
      # is the image's own COPY'd code, not writable storage worth keeping.
      - WEBCONFERENCE_ACCESS_REQUESTS_FILE=/srv/data/access-requests.json
      # CADS-webconference-demo#87/#88: cross-device sync state (encrypted
      # chat-message rows + contacts/blocked tombstone entries this bridge
      # never decrypts) -- same durability reasoning and the same already-
      # mounted volume as WEBCONFERENCE_ACCESS_REQUESTS_FILE above, no new
      # volume needed.
      - WEBCONFERENCE_SYNC_STORE_FILE=/srv/data/sync-store.json
      - CT_AGENT_CP_URL=${CT_AGENT_CP_URL:?control-plane URL}
      # Same var + same value as webconference-demo-agent's CT_AGENT_HOSTNAME
      # below, both sourced from this one top-level ${CT_AGENT_HOSTNAME} --
      # server.js derives wss://<host>/ws/channel from it directly. Never a
      # second, independently-set hostname/URL: that's what let this drift
      # stale (pointed at the tunnel's old hostname) after a rebind.
      - CT_AGENT_HOSTNAME=${CT_AGENT_HOSTNAME:?this tunnel's assigned hostname, e.g. site-34a13a96.bunsenbrenner.org}
      # This tunnel's portal id (the UUID-ish segment in /portal/tunnels/:id/...,
      # visible in the portal's own Install link) -- only used for the address
      # book's login-allowlist add/remove proxy. Optional: the contact list
      # itself works without it.
      - WEBCONFERENCE_TUNNEL_ID=${WEBCONFERENCE_TUNNEL_ID:-}
      # Comma-separated, case-insensitive. Who's allowed to revoke someone
      # else's login access -- empty leaves that endpoint open to any
      # gate-verified caller (with a startup warning), matching the old
      # behaviour until this is actually set.
      - WEBCONFERENCE_ADMIN_EMAILS=${WEBCONFERENCE_ADMIN_EMAILS:-}
      # CADS-webconference-demo#30: these three (CT_CHANNEL_OPERATOR_KEY,
      # CT_OIDC_CLIENT_SECRET, CT_PORTAL_SESSION_COOKIE) are this bridge's
      # highest-value secrets -- plain `environment:` entries are readable
      # via `docker inspect`/`docker compose config`/`/proc/1/environ` by
      # anyone who can reach this host or the docker socket. server.js now
      # supports the standard Docker-secrets convention for all three: set
      # `<NAME>_FILE=/run/secrets/<name>` instead and it reads the value
      # from that file (never landing in `environment:` at all). For
      # CT_CHANNEL_OPERATOR_KEY specifically, this now closes the argv
      # window too: when CT_CHANNEL_OPERATOR_KEY_FILE is set, mintGrants()
      # hands ct-video-call-grant the file path via its own
      # --operator-private-file flag (which reads the key in-process)
      # instead of the key value on argv -- so the key never appears in
      # this bridge's own environment output OR in /proc/<pid>/cmdline for
      # the grant-minting child process either. NOT switched over here
      # yet -- that needs the actual secret VALUES
      # written to real files outside this repo (e.g. under a
      # git-ignored ./secrets/ directory) and this service's `secrets:`
      # list wired to them; left as plain env vars below (unchanged
      # behavior) until an operator does that migration deliberately.
      # Example of what the migration looks like, once the files exist:
      #   secrets:
      #     - ct_channel_operator_key
      #     - ct_oidc_client_secret
      #     - ct_portal_session_cookie
      # (as service-level entries here) plus, at the top level of this file:
      #   secrets:
      #     ct_channel_operator_key: { file: ./secrets/ct_channel_operator_key.txt }
      #     ct_oidc_client_secret: { file: ./secrets/ct_oidc_client_secret.txt }
      #     ct_portal_session_cookie: { file: ./secrets/ct_portal_session_cookie.txt }
      # and then set (replacing the three CT_*_FILE-less lines below):
      #   CT_CHANNEL_OPERATOR_KEY_FILE=/run/secrets/ct_channel_operator_key
      #   CT_OIDC_CLIENT_SECRET_FILE=/run/secrets/ct_oidc_client_secret
      #   CT_PORTAL_SESSION_COOKIE_FILE=/run/secrets/ct_portal_session_cookie
      - CT_CHANNEL_OPERATOR_KEY=${WEBCONFERENCE_OPERATOR_KEY:?this demo's channel operator private key, 64-hex, from ct-agent channel operator-init}
      # Preferred: a durable service-account credential (POST
      # /me/service-accounts from the portal) -- doesn't expire on its own,
      # unlike the two fallbacks below, which both did (repeatedly broke
      # real calls with "401 missing bearer token" every few hours).
      - CT_OIDC_CLIENT_ID=${WEBCONFERENCE_OIDC_CLIENT_ID:-}
      - CT_OIDC_CLIENT_SECRET=${WEBCONFERENCE_OIDC_CLIENT_SECRET:-}
      # Fallbacks, only used when no service account is configured above.
      # CT_PORTAL_SESSION_COOKIE is ALSO the only option for the
      # login-allowlist add/remove routes (cookie-only, no bearer support at
      # all) -- rotate it when it expires (~8h TTL): re-login, extract
      # `ct_portal_session` from the cookie jar.
      - CT_OIDC_TOKEN=${WEBCONFERENCE_OIDC_TOKEN:-}
      - CT_PORTAL_SESSION_COOKIE=${WEBCONFERENCE_PORTAL_SESSION_COOKIE:-}
      # CADS-webconference-demo#18/#133: coturn's ephemeral-credential shared
      # secret (bunsenbrenner.org, CADS-Tunnel#520) -- signs short-lived
      # /api/ice-config TURN usernames server-side; never reaches the browser
      # or this repo. Same readSecret()/_FILE convention as CT_CHANNEL_OPERATOR_KEY
      # above, for whenever this migrates to Docker secrets.
      - TURN_SHARED_SECRET=${WEBCONFERENCE_TURN_SHARED_SECRET:?this deployment's coturn shared secret, from core/bunsenbrenner.org}
    volumes:
      - webconference_demo_access_requests:/srv/data
    expose:
      - "8791"
    restart: unless-stopped

  webconference-demo-agent:
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        # CADS-webconference-demo#29: must match build-wasm.sh/Agent.Dockerfile/
        # compose.webconference-demo.yml's own defaults -- see build-wasm.sh's
        # comment. Bumped 2026-08-13 (v0.4.8, ADMISSION_EXCHANGE_TIMEOUT 15s -> 45s
        # -- the actual root cause of the CADS-flappy-demo admission-stall saga) --
        # see Agent.Dockerfile's comment for the full story; all four sync
        # locations updated together.
        - CT_AGENT_REF=${CT_AGENT_REF:-a3d33f8b68aeafc3b53646a7ccd183c4ba807585}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_HOSTNAME=${CT_AGENT_HOSTNAME:?this tunnel's assigned hostname, e.g. site-34a13a96.bunsenbrenner.org}
      - CT_AGENT_TOKEN=${CT_AGENT_TOKEN:?this tunnel's routing token, from the portal Install page}
      - CT_AGENT_ORIGIN=webconference-demo-origin:80
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${CT_AGENT_EDGE:?edge host:port, e.g. bunsenbrenner.org:4433}
      - "CT_AGENT_EDGE_CERT_URL=${CT_AGENT_EDGE_CERT_URL:?needed while Gelb -- fetches the shared cert the agent terminates TLS with}"
      - CT_AGENT_CP_URL=${CT_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${CT_AGENT_JOIN_TOKEN:?single-use join token from the portal Install page}
      - CT_AGENT_ID=webconference-demo-selfservice
      # Restart-safe onboarding: persist the bound identity so a container restart
      # restores it instead of re-redeeming the single-use join token.
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    volumes:
      - webconference_demo_agent_state_ss:/var/lib/ct-agent
    depends_on:
      - webconference-demo-origin
    command: ["ct-agent", "onboard"]
    restart: unless-stopped

networks:
  default:
    name: webconference-demo-selfservice_default

volumes:
  webconference_demo_caddy_data_ss:
  webconference_demo_agent_state_ss:
  webconference_demo_access_requests:
