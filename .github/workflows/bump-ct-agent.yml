name: Bump pinned ct-agent

# Keeps this repo's four scimbe/ct-agent pins from silently going stale --
# Agent.Dockerfile's build arg, compose.webconference-demo.yml's AND
# compose.webconference-demo.selfservice.yml's default (the native onboarding
# agent) AND build-wasm.sh's CT_AGENT_REF (ct-agent-wasm, the browser build --
# moved into scimbe/ct-agent's own wasm/ workspace member, see that repo's
# workspace restructure commit). All four now track the SAME repo, so one
# commit bump updates all of them together.
#
# Real gap found live 2026-08-24: compose.webconference-demo.selfservice.yml
# was NOT in this workflow's sed target list despite this comment's own claim
# that all sync locations update together -- the exact #29 drift class this
# workflow exists to prevent, recurring because its own coverage was
# incomplete. Fixed; watch for a fifth CT_AGENT_REF location appearing
# elsewhere in the future the same way.
#
# Verifies the wasm build actually still succeeds against the new commit BEFORE
# opening a PR -- opens a PR rather than auto-merging either way: an untested
# upstream commit landing straight in a live production demo is exactly the risk
# a reviewed bump avoids. Enable auto-merge on this repo (branch protection ->
# allow auto-merge) if you want it to land with zero manual intervention once CI
# is green.
on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # CADS-webconference-demo#28: pinned to the exact commit v4.4.0 tags
      # (not the mutable `v4` major tag, which its owner can repoint to a
      # different commit at any time) -- this workflow has `contents: write`
      # + `pull-requests: write`, so a compromised/repointed action here
      # could push arbitrary changes to this repo under CI's own token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve latest ct-agent commit
        id: latest
        # CADS-webconference-demo#28: prefer the newest GPG-signed commit on
        # main over the raw HEAD. ct-agent now has real tags through v0.6.9
        # (its own header comment here was stale, corrected 2026-08-24) --
        # this deliberately still tracks the latest signed commit rather than
        # switching to tag-tracking, since main.rs-worth of ct-agent's own
        # consolidation fixes land between tagged releases and this repo's
        # own wasm-build verification step below is the real safety net, not
        # the tag boundary. ct-agent's PR-merge commits ARE signed even
        # though direct pushes to main
        # aren't (confirmed via the GitHub API's commit.verification field:
        # mixed signed/unsigned in recent history, not uniformly one or the
        # other). Landing the pin on a signed commit gives at least
        # integrity attestation -- this exact commit hasn't been tampered
        # with in transit/storage -- without waiting for a tag. This does
        # NOT establish the signing key itself is trusted by anyone in
        # particular; that deeper provenance question is unchanged. Falls
        # back to plain HEAD if no signed commit turns up in the recent
        # history at all, so a gap in ct-agent's signing practice can't
        # silently stop bumps from happening entirely.
        run: |
          signed_sha="$(gh api 'repos/scimbe/ct-agent/commits?sha=main&per_page=30' --jq 'first(.[] | select(.commit.verification.verified==true)) | .sha')"
          if [ -n "$signed_sha" ]; then
            sha="$signed_sha"
            echo "using latest signed commit: $sha"
          else
            sha="$(gh api repos/scimbe/ct-agent/commits/main --jq '.sha')"
            echo "no signed commit found in the last 30 -- falling back to HEAD: $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check if the pin actually changed
        id: diff
        run: |
          current="$(sed -n 's/^CT_AGENT_REF="\${CT_AGENT_REF:-\([0-9a-f]\{40\}\)}".*/\1/p' build-wasm.sh)"
          echo "current=$current"
          echo "changed=$([ "$current" != "${{ steps.latest.outputs.sha }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Bump the pins
        if: steps.diff.outputs.changed == 'true'
        run: |
          sed -i "s/^ARG CT_AGENT_REF=.*/ARG CT_AGENT_REF=${{ steps.latest.outputs.sha }}/" Agent.Dockerfile
          sed -i "s/CT_AGENT_REF:-[0-9a-f]\{40\}/CT_AGENT_REF:-${{ steps.latest.outputs.sha }}/" compose.webconference-demo.yml compose.webconference-demo.selfservice.yml build-wasm.sh

      - name: Verify -- wasm build against the new commit
        if: steps.diff.outputs.changed == 'true'
        run: ./build-wasm.sh

      - name: Open PR if it changed and verification passed
        if: steps.diff.outputs.changed == 'true'
        # CADS-webconference-demo#28: pinned to the exact commit v6.1.0 tags,
        # not the mutable `v6` major tag -- same reasoning as actions/checkout
        # above. This is the specific action the issue called out: it's a
        # third-party action (not GitHub-owned) that runs with this
        # workflow's own contents/pull-requests write token.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "chore(deps): bump pinned ct-agent to ${{ steps.latest.outputs.sha }}"
          title: "chore(deps): bump pinned ct-agent to ${{ steps.latest.outputs.sha }}"
          body: |
            Automated: scimbe/ct-agent's `main` moved to
            https://github.com/scimbe/ct-agent/commit/${{ steps.latest.outputs.sha }}
            since the last bump. The wasm build (ct-agent-wasm, `wasm/` in that repo)
            was verified against it BEFORE this PR was opened (see the workflow run).

            Review before merging -- this pin flows straight into the live
            `webconference-demo-agent` container AND `pkg/`'s wasm bundle. A redeploy
            (`./run-demo.sh up`) after merge exercises the new native ct-agent build
            for real before it reaches production.
          branch: chore/bump-ct-agent
          delete-branch: true
