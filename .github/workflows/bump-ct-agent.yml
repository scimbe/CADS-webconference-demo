name: Bump pinned ct-agent

# Keeps this repo's three scimbe/ct-agent pins from silently going stale --
# Agent.Dockerfile's build arg and compose.webconference-demo.yml's default (the
# native onboarding agent) AND build-wasm.sh's CT_AGENT_REF (ct-agent-wasm, the
# browser build -- moved into scimbe/ct-agent's own wasm/ workspace member, see
# that repo's workspace restructure commit). All three now track the SAME repo,
# so one commit bump updates all of them together. ct-agent has no tagged release
# newer than v0.3.0 yet (see Agent.Dockerfile's own comment), so this tracks its
# default branch's latest commit instead of a tag.
#
# Verifies the wasm build actually still succeeds against the new commit BEFORE
# opening a PR -- opens a PR rather than auto-merging either way: an untested
# upstream commit landing straight in a live production demo is exactly the risk
# a reviewed bump avoids. Enable auto-merge on this repo (branch protection ->
# allow auto-merge) if you want it to land with zero manual intervention once CI
# is green.
on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # CADS-webconference-demo#28: pinned to the exact commit v4.4.0 tags
      # (not the mutable `v4` major tag, which its owner can repoint to a
      # different commit at any time) -- this workflow has `contents: write`
      # + `pull-requests: write`, so a compromised/repointed action here
      # could push arbitrary changes to this repo under CI's own token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve latest ct-agent commit
        id: latest
        run: |
          sha="$(gh api repos/scimbe/ct-agent/commits/main --jq '.sha')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check if the pin actually changed
        id: diff
        run: |
          current="$(sed -n 's/^CT_AGENT_REF="\${CT_AGENT_REF:-\([0-9a-f]\{40\}\)}".*/\1/p' build-wasm.sh)"
          echo "current=$current"
          echo "changed=$([ "$current" != "${{ steps.latest.outputs.sha }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Bump the pins
        if: steps.diff.outputs.changed == 'true'
        run: |
          sed -i "s/^ARG CT_AGENT_REF=.*/ARG CT_AGENT_REF=${{ steps.latest.outputs.sha }}/" Agent.Dockerfile
          sed -i "s/CT_AGENT_REF:-[0-9a-f]\{40\}/CT_AGENT_REF:-${{ steps.latest.outputs.sha }}/" compose.webconference-demo.yml build-wasm.sh

      - name: Verify -- wasm build against the new commit
        if: steps.diff.outputs.changed == 'true'
        run: ./build-wasm.sh

      - name: Open PR if it changed and verification passed
        if: steps.diff.outputs.changed == 'true'
        # CADS-webconference-demo#28: pinned to the exact commit v6.1.0 tags,
        # not the mutable `v6` major tag -- same reasoning as actions/checkout
        # above. This is the specific action the issue called out: it's a
        # third-party action (not GitHub-owned) that runs with this
        # workflow's own contents/pull-requests write token.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "chore(deps): bump pinned ct-agent to ${{ steps.latest.outputs.sha }}"
          title: "chore(deps): bump pinned ct-agent to ${{ steps.latest.outputs.sha }}"
          body: |
            Automated: scimbe/ct-agent's `main` moved to
            https://github.com/scimbe/ct-agent/commit/${{ steps.latest.outputs.sha }}
            since the last bump. The wasm build (ct-agent-wasm, `wasm/` in that repo)
            was verified against it BEFORE this PR was opened (see the workflow run).

            Review before merging -- this pin flows straight into the live
            `webconference-demo-agent` container AND `pkg/`'s wasm bundle. A redeploy
            (`./run-demo.sh up`) after merge exercises the new native ct-agent build
            for real before it reaches production.
          branch: chore/bump-ct-agent
          delete-branch: true
